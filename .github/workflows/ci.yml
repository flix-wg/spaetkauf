name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (empty = the selected branch; use an old sha to roll back)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv run --frozen --project ../backend python ../scripts/export_static.py --odds ../data/odds.sqlite --out public/data
      - run: mkdir -p public/data/history && cp ../data/static/history/*.parquet ../data/static/history/meta.json public/data/history/
      - run: bash ../scripts/fetch_duckdb_ext.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv run --frozen --project ../backend python ../scripts/export_static.py --odds ../data/odds.sqlite --out ../frontend/public/data
      - run: npm ci
      - run: npm test

  static:
    needs: [backend, frontend, extension]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_REF: ${{ inputs.ref || github.ref }}
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          VITE_OPERATOR_LINKEDIN: ${{ vars.OPERATOR_LINKEDIN }}
        run: |
          python3 - <<'PYTHON'
          import os
          required = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']
          if os.environ['DEPLOY_REF'] in ('main', 'refs/heads/main'):
              required += ['VITE_OPERATOR_NAME', 'VITE_OPERATOR_ADDRESS', 'VITE_OPERATOR_EMAIL', 'VITE_OPERATOR_LINKEDIN']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing deployment configuration: ' + ', '.join(missing))
          PYTHON
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv run --frozen --project backend python scripts/export_static.py --odds data/odds.sqlite --out frontend/public/data
      - run: mkdir -p frontend/public/data/history && cp data/static/history/*.parquet data/static/history/meta.json frontend/public/data/history/
      - run: bash scripts/fetch_duckdb_ext.sh
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          VITE_OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          VITE_OPERATOR_LINKEDIN: ${{ vars.OPERATOR_LINKEDIN }}
      - name: Check Pages file size limit
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          oversized = [str(p) for p in Path('frontend/dist').rglob('*') if p.is_file() and p.stat().st_size > 25 * 1024 * 1024]
          if oversized:
              raise SystemExit('Files over 25 MiB: ' + ', '.join(oversized))
          PYTHON
      - name: Deploy Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_REF: ${{ inputs.ref || github.ref }}
          NO_COLOR: 1
        run: |
          set -o pipefail
          branch=preview
          if [[ "$DEPLOY_REF" == main || "$DEPLOY_REF" == refs/heads/main ]]; then branch=main; fi
          npx --yes wrangler@4.156.0 pages deploy frontend/dist --project-name kurt --branch "$branch" | tee /tmp/kurt-deploy.txt
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          urls = re.findall(r'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev', Path('/tmp/kurt-deploy.txt').read_text())
          if not urls:
              raise SystemExit('No Pages deployment URL found in Wrangler output')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'url={urls[0]}\n')
          PYTHON
      - name: Check published odds
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          origin="$DEPLOY_URL"
          for attempt in {1..6}; do
            if curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output /tmp/kurt-odds.json --write-out '%{http_code} %{content_type}' \
              "$origin/data/odds/index.json" | grep -Eq '^200 application/json([; ]|$)'; then
              if python3 -m json.tool /tmp/kurt-odds.json > /dev/null && \
                cmp --silent frontend/public/data/odds/index.json /tmp/kurt-odds.json; then exit 0; fi
            fi
            sleep 10
          done
          echo 'Published odds did not return 200 JSON matching the local index' >&2
          exit 1
