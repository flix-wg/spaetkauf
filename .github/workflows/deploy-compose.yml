# Reusable: ship a git ref to a server over SSH and run `docker compose up -d --build`.
# Generic on purpose; no project names. The ship logic is inlined, so a caller needs no files
# from this repo. The env file on the server is never written, read or printed.
name: Deploy Compose

on:
  workflow_call:
    inputs:
      target_dir:
        description: Directory on the server that receives the code
        type: string
        required: true
      compose_file:
        description: Compose file path inside the repo
        type: string
        default: docker-compose.yml
      env_file:
        description: Env file name inside target_dir on the server (must already exist)
        type: string
        default: .env
      health_url:
        description: URL that must answer 2xx within about 90 s after the deploy
        type: string
        required: true
      ref:
        description: Git ref to deploy (empty = the ref of the calling run)
        type: string
        default: ""
    secrets:
      DEPLOY_HOST:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
      DEPLOY_USER:
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST or DEPLOY_SSH_KEY is not set, deploy skipped"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.target_dir }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DIR: ${{ inputs.target_dir }}
          COMPOSE: ${{ inputs.compose_file }}
          ENVFILE: ${{ inputs.env_file }}
          URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          TARGET="${DEPLOY_USER:-root}@$DEPLOY_HOST"
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::DEPLOY_KNOWN_HOSTS is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          (umask 077; printf %sn "$KEY" > ~/.ssh/deploy_key; printf %sn "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          # Keepalives: a quiet build must not leave a silently dropped session hanging.
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
                    -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          sha="$(git rev-parse --short HEAD)"
          dir_q="$(printf %q "$DIR")"; compose_q="$(printf %q "$COMPOSE")"; env_q="$(printf %q "$ENVFILE")"
          # One ssh connection only: some hosts stall a second connection opened right after the first.
          git archive HEAD | ssh "${ssh_opts[@]}" "$TARGET" "set -e; mkdir -p $dir_q; tar -x -C $dir_q; echo $sha > $dir_q/REVISION; cd $dir_q; test -f $env_q; docker compose --env-file $env_q -f $compose_q up -d --build --quiet-pull </dev/null"
          for _ in $(seq 18); do
            if curl -fsS -o /dev/null --max-time 5 "$URL" 2>/dev/null; then echo "deployed $sha, healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::health check failed after 90 s"; exit 1
