# Reusable: ship a git ref to a server over SSH and run `docker compose up -d --build`.
# Generic on purpose; no project names. The ship logic is inlined, so a caller needs no files
# from this repo. The env file on the server is never written, read or printed.
name: Deploy Compose

on:
  workflow_call:
    inputs:
      target_dir:
        description: Directory on the server that receives the code
        type: string
        required: true
      compose_file:
        description: Compose file path inside the repo
        type: string
        default: docker-compose.yml
      env_file:
        description: Env file name inside target_dir on the server (must already exist)
        type: string
        default: .env
      health_url:
        description: URL that must answer 2xx within about 90 s after the deploy
        type: string
        required: true
      ref:
        description: Git ref to deploy (empty = the ref of the calling run)
        type: string
        default: ""
    secrets:
      DEPLOY_HOST:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
      DEPLOY_USER:
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST or DEPLOY_SSH_KEY is not set, deploy skipped"
          fi
