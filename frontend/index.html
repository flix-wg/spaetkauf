<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FD4F00" />
    <meta name="description" content="Buy the cheap ticket for the train that is usually late. Ride the better one." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Spätkauf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Spätkauf</title>
    <script>
      try {
        if (sessionStorage.getItem('spaetkauf.splash')) document.documentElement.classList.add('splash-skip')
      } catch {}
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Spätkauf is loading">
      <div class="sp-stage">
        <span class="sp-trail"></span>
        <span class="sp-kurt">
          <svg class="kurt kurt-crawl" viewBox="0 0 80 60" aria-hidden="true">
            <path class="kurt-body" fill="#14161A" d="M14 54 C8 54 4.5 51.5 4.5 47 L4.5 33 C4.5 24 19 24 19 33 L19 40 C19 43.5 21 45 24 45 L64 45 C70 45 74 47 77 52.5 C75.5 53.5 73.5 54 70 54 Z" />
            <g class="kurt-head">
              <path d="M9 26 L7.2 14.5 M15 26 L21.5 13.5" stroke="#14161A" stroke-width="2.6" stroke-linecap="round" />
              <g class="kurt-eye"><circle cx="7.2" cy="10.5" r="4.4" fill="#14161A" /><circle cx="6" cy="9.2" r="1.4" fill="#fff" /></g>
              <g class="kurt-eye"><circle cx="21.5" cy="9.5" r="4.4" fill="#14161A" /><circle cx="20.3" cy="8.2" r="1.4" fill="#fff" /></g>
              <path d="M7.5 33.5 q2.4 2.4 5 0.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" />
            </g>
            <g class="kurt-shell">
              <circle cx="46" cy="27" r="19" fill="#FD4F00" stroke="#14161A" stroke-width="2.6" />
              <path class="kurt-spiral" d="M47.5 28 a2.3 2.3 0 0 0 -4.6 0 a4.6 4.6 0 0 0 9.2 0 a6.9 6.9 0 0 0 -13.8 0 a9.2 9.2 0 0 0 18.4 0 a11.5 11.5 0 0 0 -23 0" stroke="#14161A" stroke-width="2.6" fill="none" stroke-linecap="round" />
              <path d="M33.5 15.5 a16 16 0 0 1 9 -4.6" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round" />
            </g>
          </svg>
        </span>
      </div>
      <p class="sp-word">Spätkauf</p>
      <p class="sp-quip"><span>Kurt is checking which trains run late…</span><span>Still faster than a late ICE.</span></p>
    </div>
    <script>
      // Hide the wordmark until its font is in, so it never jumps from the fallback face.
      ;(function () {
        var s = document.getElementById('splash')
        var on = function () { s.classList.add('fonts') }
        setTimeout(on, 900)
        if (document.fonts) document.fonts.load('700 44px "Space Grotesk"').then(on, on)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
